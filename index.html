<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spieleabend">
<meta name="theme-color" content="#2f2a8c">
<meta name="robots" content="noindex,nofollow,noarchive">

<title>Spieleabend</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@600;800&display=swap">
<style>
html,body{height:100%;margin:0}
body{background:#2f2a8c;background-image:radial-gradient(circle at 2px 2px,rgba(255,246,227,.13) 1.6px,transparent 0),radial-gradient(120% 55% at 50% 0%,rgba(255,255,255,.22),transparent 72%);background-size:22px 22px,100% 100%;color:#fff6e3;font:600 16px/1.4 "Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;
  padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));box-sizing:border-box}
form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-family:"Lilita One","Arial Rounded MT Bold",sans-serif;font-weight:400;font-size:52px;line-height:.9;color:#ffd23f;text-shadow:0 5px 0 #1a1433}
.fan{position:relative;height:96px;margin-bottom:6px}
.fan i{position:absolute;left:50%;top:6px;width:58px;height:82px;margin-left:-29px;border:3px solid #1a1433;border-radius:12px;box-shadow:0 5px 0 #1a1433;animation:fan .7s cubic-bezier(.2,1.4,.4,1) both}
.fan i:nth-child(1){background:#6f9bff;transform:translateX(-46px) rotate(-22deg)}
.fan i:nth-child(2){background:#ff7a55;transform:translateX(-15px) rotate(-7deg);animation-delay:.06s}
.fan i:nth-child(3){background:#c084ff;transform:translateX(16px) rotate(8deg);animation-delay:.12s}
.fan i:nth-child(4){background:#2fd08c;transform:translateX(47px) rotate(23deg);animation-delay:.18s}
@keyframes fan{from{transform:none}}
form{text-align:left}
@media (prefers-reduced-motion:reduce){.fan i{animation:none}}
p{margin:0}
input{font:inherit;font-size:18px;padding:13px 14px;border:3px solid #1a1433;border-radius:14px;background:#fff;color:#1a1433}
button{font:inherit;font-family:"Lilita One","Arial Rounded MT Bold",sans-serif;font-weight:400;font-size:22px;padding:14px;border:3px solid #1a1433;border-radius:16px;background:#ffd23f;color:#1a1433;box-shadow:0 5px 0 #1a1433}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #1a1433}
#msg{min-height:1.4em;color:#ffb3c1}
[hidden]{display:none}
</style>
</head>
<body>
<form id="f" hidden>
  <div class="fan" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <h1>Spieleabend</h1>
  <p>Privat. Bitte Passwort eingeben.</p>
  <input id="pw" type="password" autocomplete="current-password" aria-label="Passwort" placeholder="Passwort" required>
  <button type="submit">Öffnen</button>
  <p id="msg" role="alert"></p>
</form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const toB64=u=>{ let s=''; u.forEach(b=>s+=String.fromCharCode(b)); return btoa(s); };
const f=document.getElementById('f'), msg=document.getElementById('msg');
try{ if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
async function derive(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(SALT),iterations:ITER},base,512));
}
/* Prüft erst die Signatur, entschlüsselt dann und ersetzt diese Seite durch die App */
async function unlock(dk){
  const raw=b64(DATA), iv=raw.slice(0,16), mac=raw.slice(16,48), ct=raw.slice(48);
  const signed=new Uint8Array(16+ct.length); signed.set(iv); signed.set(ct,16);
  const mk=await crypto.subtle.importKey('raw',dk.slice(32),{name:'HMAC',hash:'SHA-256'},false,['verify']);
  if(!await crypto.subtle.verify('HMAC',mk,mac,signed)) return false;
  const ek=await crypto.subtle.importKey('raw',dk.slice(0,32),{name:'AES-CBC'},false,['decrypt']);
  let html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC',iv},ek,ct));
  html=html.replace('<head>','<head><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="robots" content="noindex,nofollow,noarchive">').replace('content="Kneifen"','content="Spieleabend"');
  document.open(); document.write(html); document.close();
  return true;
}
(async()=>{
  if(!(window.crypto && crypto.subtle)){ f.hidden=false; msg.textContent='Diese Seite braucht eine sichere Verbindung (https).'; return; }
  try{ const k=localStorage.getItem('sa-key'); if(k && await unlock(b64(k))) return; localStorage.removeItem('sa-key'); }catch(e){}
  f.hidden=false;
})();
f.addEventListener('submit',async e=>{
  e.preventDefault(); msg.textContent='Einen Moment …';
  try{
    const dk=await derive(document.getElementById('pw').value);
    try{ localStorage.setItem('sa-key',toB64(dk)); }catch(e){}
    if(!await unlock(dk)){ try{ localStorage.removeItem('sa-key'); }catch(e){} msg.textContent='Falsches Passwort.'; }
